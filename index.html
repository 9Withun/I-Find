<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-Find | ตัวช่วยค้นหาสินค้าตามไลฟ์สไตล์</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="lang-switcher">
        <button id="langTH" class="lang-btn active">TH</button>
        <span>|</span>
        <button id="langEN" class="lang-btn">EN</button>
    </div>

    <main class="container">
        <header>
            <h1 data-th="ค้นหาสินค้าที่ใช่ ตามการใช้งานของคุณ"
                data-en="Find the right products for your lifestyle.">ค้นหาสินค้าที่ใช่ ตามการใช้งานของคุณ</h1>
            <p class="subtitle"
                data-th="I-Find จะช่วยแนะนำสินค้าที่เหมาะกับไลฟ์สไตล์ของคุณ พร้อมลิงก์ร้านค้าให้เลือกจากหลายแพลตฟอร์มในที่เดียว"
                data-en="I-Find recommends products based on your lifestyle and gives you multiple store links so you can pick your favorite seller.">
                I-Find จะช่วยแนะนำสินค้าที่เหมาะกับไลฟ์สไตล์ของคุณ พร้อมลิงก์ร้านค้าให้เลือกจากหลายแพลตฟอร์มในที่เดียว
            </p>
        </header>

        <section class="finder-card">
            <h2 data-th="บอกเราว่าคุณกำลังมองหาอะไร" data-en="Tell us what you need">บอกเราว่าคุณกำลังมองหาอะไร</h2>
            <form id="finderForm">
                <div class="field-grid">
                    <label class="autocomplete-field">
                        <span data-th="สินค้า/หมวดหมู่" data-en="Product type">สินค้า/หมวดหมู่</span>
                        <input id="queryInput" type="text"
                            data-th-placeholder="เช่น โทรศัพท์, หูฟัง, รองเท้าเดินป่า"
                            data-en-placeholder="e.g. smartphone, headphones, hiking shoes" autocomplete="off" required>
                        <div id="querySuggestions" class="autocomplete-list" role="listbox"></div>
                    </label>

                    <label>
                        <span data-th="ไลฟ์สไตล์การใช้งาน" data-en="Lifestyle">ไลฟ์สไตล์การใช้งาน</span>
                        <select id="lifestyleSelect" required>
                            <option value="everyday" data-th="ใช้งานทั่วไป" data-en="Everyday use">ใช้งานทั่วไป</option>
                            <option value="gaming" data-th="เกมมิ่ง/สตรีมมิ่ง" data-en="Gaming/Streaming">เกมมิ่ง/สตรีมมิ่ง</option>
                            <option value="creative" data-th="ครีเอเตอร์/งานสร้างสรรค์" data-en="Creative Work">ครีเอเตอร์/งานสร้างสรรค์</option>
                            <option value="outdoor" data-th="เดินทาง/เอาท์ดอร์" data-en="Travel/Outdoor">เดินทาง/เอาท์ดอร์</option>
                            <option value="work" data-th="ทำงาน/ออฟฟิศ" data-en="Work/Productivity">ทำงาน/ออฟฟิศ</option>
                        </select>
                    </label>

                    <label>
                        <span data-th="งบประมาณ" data-en="Budget range">งบประมาณ</span>
                        <select id="budgetSelect" required>
                            <option value="entry" data-th="ประหยัด (ต่ำกว่า 5,000 บาท)" data-en="Entry (under 150 USD)">ประหยัด (ต่ำกว่า 5,000 บาท)</option>
                            <option value="mid" data-th="คุ้มค่า (5,000 - 20,000 บาท)" data-en="Mid (150-600 USD)">คุ้มค่า (5,000 - 20,000 บาท)</option>
                            <option value="premium" data-th="พรีเมียม (20,000+ บาท)" data-en="Premium (600+ USD)">พรีเมียม (20,000+ บาท)</option>
                        </select>
                    </label>
                </div>

                <button class="search-btn" type="submit" data-th="แสดงคำแนะนำ" data-en="Show recommendations">แสดงคำแนะนำ</button>
            </form>
        </section>

        <section class="results" id="resultsSection" aria-live="polite">
            <h2 data-th="คำแนะนำสำหรับคุณ" data-en="Recommendations for you">คำแนะนำสำหรับคุณ</h2>
            <p class="hint" id="emptyText" data-th="กรอกข้อมูลด้านบน แล้วเราจะช่วยคัดสินค้าที่เหมาะกับคุณ"
                data-en="Fill in your needs above and we will recommend the best matching options.">
                กรอกข้อมูลด้านบน แล้วเราจะช่วยคัดสินค้าที่เหมาะกับคุณ
            </p>
            <div id="resultsGrid" class="results-grid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
